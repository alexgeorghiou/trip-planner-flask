services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://trips:trips@db:5432/trips
      SECRET_KEY: ${SECRET_KEY:-change-me}
      GEOCODER: ${GEOCODER:-nominatim}
      # Nominatim's usage policy asks for an identifying User-Agent and contact address.
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-trip-planner-flask/0.1 (self-hosted)}
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trips
      POSTGRES_PASSWORD: trips
      POSTGRES_DB: trips
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trips -d trips"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
