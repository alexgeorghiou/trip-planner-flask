[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-planner-flask"
version = "0.1.0"
description = "Day-by-day travel itinerary planner with place search, route ordering and shareable read-only trips."
readme = "README.md"
license = "MIT"
authors = [{ name = "Alex Georghiou" }]
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "flask-smorest>=0.44,<1",
  "marshmallow>=3.20,<4",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
prod = [
  "gunicorn>=22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trip_planner = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
